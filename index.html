.sub{font-family:var(--font);font-weight:900;letter-spacing:-.03em;white-space:nowrap}
.stripe{display:flex;gap:6px}
.stripe i{height:7px;width:clamp(22px,5vw,40px);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.tile{--a:var(--kor1);--b:var(--kor2);grid-column:span 3;position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-height:168px;padding:22px;
  border-radius:22px;color:var(--ink);text-decoration:none;
  background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(140deg,var(--a),var(--b));
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 24px -16px var(--b);
  transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s}
.tile.big{grid-column:span 4;min-height:210px}
.tile.wide{grid-column:span 6;min-height:180px}
.tile.full{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:18px;padding:18px 22px}
.txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.full .name{font-size:1.5rem;padding-right:60px}
.desc{font-size:1rem;font-weight:600;line-height:1.5;opacity:.92;word-break:keep-all;padding-right:60px}
.full .go{top:50%;margin-top:-17px}
.full .mark{right:80px;bottom:-40px}
.wide .ic{height:88px;min-width:88px;padding:0 8px;border-radius:22px;background:rgba(255,255,255,.26)}
.ic svg.sparta{width:72px;height:72px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.wide .name{font-size:2.05rem;font-weight:900}
.tile:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 20px 34px -16px var(--b)}
.tile:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
.ic{display:flex;align-items:center;justify-content:center;gap:4px;height:56px;min-width:56px;padding:0 12px;width:max-content;
  border-radius:16px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(2px)}
.ic svg{width:28px;height:28px}
.ic .gl{font-weight:900;font-size:1.65rem;line-height:1;letter-spacing:-.02em}
.ic .gl.sm{font-size:1.15rem;letter-spacing:.02em}
.name{word-break:keep-all;font-size:1.2rem;font-weight:800;line-height:1.35;letter-spacing:-.015em;text-wrap:balance;padding-right:34px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.big .name{font-size:1.45rem}
.mark{position:absolute;z-index:-1;right:-18px;bottom:-26px;width:150px;height:150px;opacity:.16;transform:rotate(-12deg);
  transition:transform .35s ease;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:120px;line-height:1}
.mark svg{width:100%;height:100%}
.big .mark{width:180px;height:180px;font-size:150px}
.mark.txt-sm{font-size:78px}
.big .mark.txt-sm{font-size:92px}
.tile:hover .mark{transform:rotate(-2deg) scale(1.08)}
.go{position:absolute;right:20px;top:22px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.18);transition:background .2s,transform .2s}
.go svg{width:16px;height:16px}
.tile:hover .go{background:rgba(255,255,255,.95);color:var(--b);transform:rotate(45deg)}
.kor{--a:var(--kor1);--b:var(--kor2)} .eng{--a:var(--eng1);--b:var(--eng2)} .inq{--a:var(--inq1);--b:var(--inq2)}
.map{--a:var(--map1);--b:var(--map2)} .maj{--a:var(--maj1);--b:var(--maj2)} .uni{--a:var(--uni1);--b:var(--uni2)} .pln{--a:var(--pln1);--b:var(--pln2)} .g1{--a:var(--g1a);--b:var(--g1b)} .g2{--a:var(--g2a);--b:var(--g2b)} .exp{--a:var(--g1a);--b:var(--g2b)}
@media (max-width:860px){.tile,.tile.big,.tile.wide{grid-column:span 6}.tile.inq,.tile.full{grid-column:span 12}}
@media (max-width:460px){.tile,.tile.big,.tile.wide,.tile.inq,.tile.full{grid-column:span 12;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;padding:18px}
  .name,.big .name,.full .name{font-size:1.1rem;padding-right:40px}.desc{font-size:.86rem;padding-right:40px}.wide .name{font-size:1.35rem}.wide .ic{height:68px;min-width:68px}.ic svg.sparta{width:56px;height:56px}.go{top:50%;margin-top:-17px}
  .mark,.big .mark{width:110px;height:110px;font-size:90px;right:30px}.mark.txt-sm,.big .mark.txt-sm{font-size:56px}}
@media (prefers-reduced-motion:reduce){.tile,.mark,.go{transition:none}.tile:hover{transform:none}.tile:hover .mark{transform:rotate(-12deg)}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
